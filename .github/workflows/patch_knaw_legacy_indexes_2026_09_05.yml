name: Patch KNAW legacy index locators

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch_knaw_legacy_indexes_2026_09_05.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard KNAW control note against concurrent edits
        shell: bash
        run: |
          test "$(git hash-object research/article_knaw_malinowski_1933_membership_mechanics_recheck_2026-09-05.md)" = "a21c1eddc0ff568b8a28f4511f2904e3aa77a87c"
      - name: Add 1925 legacy index routes
        shell: python
        run: |
          from pathlib import Path
          p = Path('research/article_knaw_malinowski_1933_membership_mechanics_recheck_2026-09-05.md')
          s = p.read_text(encoding='utf-8')

          anchor = "Inv. 19 is useful only as evidence that Letterkunde minutes are a numbered volume series. It does not justify guessing the inventory number of the volume covering 1933.\n\n"
          addition = """### Legacy index route: post-1940 archive indexes reach back to 1925\n\nThe official 1940–1993 KNAW finding aid exposes a more direct route to the missing 1933 minutes and dossier than guessing the old volume number. The archive remains at **Noord-Hollands Archief, Haarlem**. Its `Oude toegangen op het archief` include:\n\n- **inv. 1462–1466**: an alphabetically arranged card index to the minute books of the Board, United Meeting, Afdelingen Letterkunde and Natuurkunde, and the division boards, covering **1925–1985**. The finding aid states that each card can carry a short subject description, a Roman numeral identifying the relevant minute book, and an Arabic page number. **Inv. 1464 = J through O**, so a `Malinowski` heading, if present, should fall in this box and could directly identify the minute-book volume and page for the 1933 candidature/election discussion.\n- **inv. 1468–1471**: an alphabetically arranged subject-card index to the institutional archive dossiers, covering **(1925–1980)**. **Inv. 1470 = M through R**. A `Malinowski`, membership, or related heading, if present, could point to the old dossier/rubric used by the secretariat.\n\nOfficial control: Staatscourant 2019, nr. 64667, especially the finding-aid description of the old indexes and inv. 1462–1471: https://zoek.officielebekendmakingen.nl/stcrt-2019-64667.html\n\nStatus: **PRIORITY INDEX LOCATORS / PARTIAL**. The finding aid secures the date ranges, box ranges, and indexing mechanics. The cards themselves have not been inspected, so do not claim that a Malinowski card exists or infer its Roman numeral/page/dossier reference. These index boxes are now the preferred route before any further attempt to infer the 1933 Letterkunde notulen volume from chronology.\n\nArchive-pull order for the KNAW question is now:\n\n1. **toegang 64, inv. 569** — test whether the membership-appointment dossier contains Malinowski/foreign-member material;\n2. **1940–1993 KNAW archive, inv. 1464 (J–O)** — inspect the minute-book index under `Malinowski` and relevant membership headings for a Roman volume + page;\n3. **same archive, inv. 1470 (M–R)** — inspect the dossier index for `Malinowski` / membership / candidature pointers;\n4. then pull the exact old minute book / dossier exposed by those indexes.\n\n"""
          assert s.count(anchor) == 1, s.count(anchor)
          s = s.replace(anchor, anchor + addition, 1)

          old_secure = "- a directly relevant membership-file locator is now known: toegang 64, inv. 569, `Benoemingen van leden van de afdeling letterkunde 1855–1940`; its coverage of foreign members/Malinowski remains to be verified from the dossier;\n- Huizinga had been president of the KNAW Afdeeling Letterkunde since 11 November 1929, so his May 1933 refusal of a leading role occurred from institutional office rather than institutional distance."
          new_secure = "- a directly relevant membership-file locator is now known: toegang 64, inv. 569, `Benoemingen van leden van de afdeling letterkunde 1855–1940`; its coverage of foreign members/Malinowski remains to be verified from the dossier;\n- the later KNAW archive preserves legacy indexes reaching back to 1925: inv. 1464 (J–O) indexes minute books and can supply Roman volume/page references; inv. 1470 (M–R) indexes old dossiers. Their contents under `Malinowski` remain uninspected;\n- Huizinga had been president of the KNAW Afdeeling Letterkunde since 11 November 1929, so his May 1933 refusal of a leading role occurred from institutional office rather than institutional distance."
          assert s.count(old_secure) == 1, s.count(old_secure)
          s = s.replace(old_secure, new_secure, 1)

          old_open = "- exact inventory number for the Letterkunde minutes covering May–June 1933 and any separate nomination/`voordracht` file.\n\nThe next primary control is now **inspection of Noord-Hollands Archief, toegang 64, inv. 569**, followed by identification of the 1933 Letterkunde minutes volume if inv. 569 does not itself settle the mechanics. A directly accessible contemporaneous Academy proceedings/minutes volume could independently close the same gap."
          new_open = "- exact inventory number/page for the Letterkunde minutes covering May–June 1933 and any separate nomination/`voordracht` file; the preferred discovery path is now the uninspected legacy cards in inv. 1464 and 1470.\n\nThe next primary control is now **inspection of Noord-Hollands Archief, toegang 64, inv. 569, plus the legacy indexes inv. 1464 and 1470 in the 1940–1993 KNAW archive**. Those index cards are specifically designed to expose the old minute-book Roman volume/page and dossier rubric, so they take precedence over further speculative volume-number searching. A directly accessible contemporaneous Academy proceedings/minutes volume could independently close the same gap."
          assert s.count(old_open) == 1, s.count(old_open)
          s = s.replace(old_open, new_open, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit without overwriting concurrent work
        shell: bash
        run: |
          git config user.name 'Haohao Zhang'
          git config user.email 'zhhos98@gmail.com'
          git add research/article_knaw_malinowski_1933_membership_mechanics_recheck_2026-09-05.md
          git commit -m 'Add KNAW legacy index route to 1933 candidature records'
          git pull --rebase origin main
          git push origin HEAD:main
