name: tmp-split-chunk002
on:
  push:
    paths:
      - '.github/workflows/tmp_split_chunk002.yml'
permissions:
  contents: write
jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split rough OCR JSON page-by-page
        run: |
          python - <<'PY'
          import json, pathlib
          src = pathlib.Path('chunk_002.pdf_by_PaddleOCR-VL-1.6.json')
          data = json.loads(src.read_text(encoding='utf-8'))
          out = pathlib.Path('_tmp_chunk002_pages')
          out.mkdir(exist_ok=True)
          for i, page in enumerate(data, 1):
              (out/f'p{i:03d}.json').write_text(json.dumps(page, ensure_ascii=False, indent=2), encoding='utf-8')
              blocks = page.get('prunedResult', {}).get('parsing_res_list', [])
              lines=[]
              for b in blocks:
                  c=(b.get('block_content') or '').strip()
                  if c:
                      lines.append(f"[{b.get('block_id','?')}|{b.get('block_label','?')}] {c}")
              (out/f'p{i:03d}.txt').write_text('\n\n'.join(lines), encoding='utf-8')
          (out/'manifest.txt').write_text(f'pages={len(data)}\n', encoding='utf-8')
          PY
      - name: Commit page files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _tmp_chunk002_pages
          git commit -m 'tmp: split chunk_002 OCR JSON page by page' || exit 0
          git push
