name: Patch current handoff article state

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Historical one-shot patch is retired
        run: |
          echo "This one-shot workflow is retained as procedural provenance only."
          echo "CURRENT_HANDOFF.md is now maintained directly from the canonical article state."
