name: backwards-pdf-corrections
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backwards_pdf_corrections.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply PDF-verified correction ledgers
        run: |
          for chunk in 67 68 69 70 71; do
            python scripts/apply_pdf_corrections.py "$chunk"
          done
          python scripts/build_pdf_verification_log.py 67 \
            '41:80:chunk_067__p0041-0080.pdf' \
            '161:200:chunk_067__p0161-0200.pdf' \
            '201:223:chunk_067__p0201-0223.pdf'
          python scripts/build_pdf_verification_log.py 68 \
            '121:160:chunk_068__p0121-0160.pdf' \
            '161:200:chunk_068__p0161-0200.pdf'
          python scripts/build_pdf_verification_log.py 69 \
            '1:40:chunk_069__p0001-0040.pdf' \
            '41:80:chunk_069__p0041-0080.pdf' \
            '81:120:chunk_069__p0081-0120.pdf' \
            '121:160:chunk_069__p0121-0160.pdf' \
            '161:200:chunk_069__p0161-0200.pdf' \
            '201:214:chunk_069__p0201-0214.pdf'
          python scripts/build_pdf_verification_log.py 70 \
            '1:40:chunk_070__p0001-0040.pdf' \
            '41:80:chunk_070__p0041-0080.pdf' \
            '81:120:chunk_070__p0081-0120.pdf' \
            '161:186:chunk_070__p0161-0186.pdf'
          python scripts/build_pdf_verification_log.py 71 \
            '1:40:chunk_071__p0001-0040.pdf'
      - name: Validate ledgers and page logs
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          expected = {67: 103, 68: 80, 69: 214, 70: 146, 71: 40}
          for chunk, count in expected.items():
              stem = f'chunk_{chunk:03d}'
              raw = json.loads(Path(f'{stem}.pdf_by_PaddleOCR-VL-1.6.json').read_text())
              corrected = json.loads(Path(f'{stem}.pdf_by_PaddleOCR-VL-1.6.corrected.json').read_text())
              ledger = json.loads(Path(f'corrections/{stem}_manual.json').read_text())
              changed = {i + 1 for i, pair in enumerate(zip(raw, corrected)) if pair[0] != pair[1]}
              ledger_pages = {int(item['page']) for item in ledger}
              assert changed == ledger_pages, (chunk, changed, ledger_pages)
              with Path(f'review/{stem}/pdf_verification_log_v1.tsv').open() as stream:
                  rows = list(csv.DictReader(stream, delimiter='\t'))
              assert len(rows) == count, (chunk, len(rows), count)
          PY
          git diff --check
      - name: Commit corrected JSON and logs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            chunk_067.pdf_by_PaddleOCR-VL-1.6.corrected.json \
            chunk_068.pdf_by_PaddleOCR-VL-1.6.corrected.json \
            chunk_069.pdf_by_PaddleOCR-VL-1.6.corrected.json \
            chunk_070.pdf_by_PaddleOCR-VL-1.6.corrected.json \
            chunk_071.pdf_by_PaddleOCR-VL-1.6.corrected.json \
            review/chunk_067/applied_patch_audit_v1.tsv review/chunk_067/pdf_verification_log_v1.tsv \
            review/chunk_068/applied_patch_audit_v1.tsv review/chunk_068/pdf_verification_log_v1.tsv \
            review/chunk_069/applied_patch_audit_v1.tsv review/chunk_069/pdf_verification_log_v1.tsv \
            review/chunk_070/applied_patch_audit_v1.tsv review/chunk_070/pdf_verification_log_v1.tsv \
            review/chunk_071/applied_patch_audit_v1.tsv review/chunk_071/pdf_verification_log_v1.tsv
          git commit -m 'data: apply backwards PDF corrections for chunks 067-071'
          git pull --rebase origin main
          git push origin main
