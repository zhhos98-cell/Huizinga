name: Patch Draft 04 Nieuwenhuis genealogy

on:
  push:
    paths:
      - '.github/workflows/patch_draft04_nieuwenhuis_genealogy_2026_09_05.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard canonical Draft 04 blob
        shell: bash
        run: |
          actual=$(git hash-object writing/benevolent_outsider_draft_04_method_primitive_1921_1933.md)
          expected=07b4933d15dae5c8dc5180f711097373a3be7bca
          test "$actual" = "$expected" || { echo "Draft blob changed: $actual"; exit 1; }
      - name: Apply exact genealogy patch
        run: python scripts/patch_draft04_nieuwenhuis_genealogy_2026_09_05.py
      - name: Commit and push safely
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add writing/benevolent_outsider_draft_04_method_primitive_1921_1933.md
          git commit -m "Add Nieuwenhuis 1913 genealogy control to Draft 04"
          git pull --rebase origin main
          git push origin HEAD:main
