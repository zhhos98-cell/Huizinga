name: Patch AGENTS Leiden locator status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch_agents_leiden_locator_status_2026_09_05.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard AGENTS against concurrent edits
        shell: bash
        run: |
          test "$(git hash-object AGENTS.md)" = "8d0cf10deb94e8547338c90b2142859bec573f3b"
      - name: Refresh Leiden archive mapping status only
        shell: python
        run: |
          from pathlib import Path
          p = Path('AGENTS.md')
          s = p.read_text()
          old = """Leiden archive locators must be distinguished from repository audit pointers. `review/chunk_*` is an internal digital-corpus coordinate, **not** a Leiden shelfmark. Three Draft 04 mappings are now source-controlled: Indian medicine = Huizinga archive no. **34 II** (`Oldindian medicine`); Philip/Burgundian material = no. **27**, with the 1929 portrait-photograph sequence in `env. Iconographie`; the 18 March 1930 French lecture `Aperçu de la civilisation hollandaise du XVIIe siècle` = no. **29 II.1**. See `research/article_leiden_archive_locator_mapping_2026-09-05.md`. Do not extend those numbers to adjacent chunk material. Formal inventory mapping remains unresolved for the separate Renaissance packet `chunk_028:p0183`, American cards/prose `chunk_018:p0198–p0238`, the `Trois esprits prégothiques` manuscript in `chunk_002`, the history/science cards `chunk_020:p0201–p0204`, the Leiden American itinerary `chunk_019:p0031`, and the `Ridderspelen als beleving der Feodaltijd` slip at `chunk_013:p0142`. Keep the internal pointer until a formal mapping is recovered; never guess from neighboring H.A. numbers."""
          new = """Leiden archive locators must be distinguished from repository audit pointers. `review/chunk_*` is an internal digital-corpus coordinate, **not** a Leiden shelfmark. Three Draft 04 mappings are source-controlled: Indian medicine = Huizinga archive no. **34 II** (`Oldindian medicine`); Philip/Burgundian material = no. **27**, with the 1929 portrait-photograph sequence in `env. Iconographie`; the 18 March 1930 French lecture `Aperçu de la civilisation hollandaise du XVIIe siècle` = no. **29 II.1**. America material is now narrower but still not page-mapped: Huizinga Online repeatedly assigns America material to **H.A./HUI 28**, and Thor Rydin directly cites the note `Juist nu niets belangrijker dan Amerika ... En wat weten wij ervan?` as **HA 28 III 7**. Treat **H.A. 28 as a SECURE family locator** and **28 III 7 as secure only for that specific quoted note**; do not assign `chunk_018:p0198–p0238` or `chunk_019:p0031` to 28 III 7 without object/page identity. For `Trois esprits prégothiques`, `[H.A. 1, inv.p. 10]` in the calendar controls the 1930 Paris event, not the manuscript shelfmark. Do not guess HUI 31/32 from adjacency: the calendar uses H.A. 31 for `Restauratie` and H.A. 32 for `Duitsche Rijk 1648–1688` / `Europa politiek rond 1700`. Reuse the strict source-resolution method already demonstrated in `review/chunk_071/SOURCE_RESOLUTION_V2.md`: exact inventory/object metadata plus page-level source comparison before promoting a chunk to H.A./HUI. Formal mapping remains unresolved for the Renaissance packet `chunk_028:p0183`, American cards/prose `chunk_018:p0198–p0238`, `Trois esprits prégothiques` in `chunk_002`, history/science cards `chunk_020:p0201–p0204`, American itinerary `chunk_019:p0031`, and `Ridderspelen als beleving der Feodaltijd` at `chunk_013:p0142`. See `research/article_leiden_archive_locator_mapping_2026-09-05.md`."""
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new))
      - name: Commit without overwriting concurrent work
        shell: bash
        run: |
          git config user.name 'Haohao Zhang'
          git config user.email 'zhhos98@gmail.com'
          git add AGENTS.md
          git commit -m 'Tighten Leiden archive locator controls'
          git pull --rebase origin main
          git push origin HEAD:main
