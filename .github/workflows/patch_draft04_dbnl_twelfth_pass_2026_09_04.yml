name: Patch Draft 04 from DBNL twelfth pass

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch_draft04_dbnl_twelfth_pass_2026_09_04.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard canonical draft against post-eleventh-pass edits
        shell: bash
        run: |
          current=$(git hash-object writing/benevolent_outsider_draft_04_method_primitive_1921_1933.md)
          controlled=$(git show 61ead035897c4b21b7d00d7a9479cd62ab13f7c3:writing/benevolent_outsider_draft_04_method_primitive_1921_1933.md | git hash-object --stdin)
          test "$current" = "$controlled"
      - name: Apply source-locked chronology calibration
        run: python scripts/patch_draft04_dbnl_twelfth_pass_2026_09_04.py
      - name: Commit without overwriting concurrent work
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add writing/benevolent_outsider_draft_04_method_primitive_1921_1933.md
          git commit -m 'Calibrate April 1926 transatlantic chronology'
          git pull --rebase origin main
          git push origin main
