name: resolve-chunk071-source
on:
  push:
    paths:
      - '.github/workflows/tmp_resolve_chunk071_source.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve exact HUI 75 I 1.1 page thumbnails
        run: |
          python - <<'PY'
          import csv, json, pathlib, time, urllib.error, urllib.parse, urllib.request

          review = pathlib.Path('review/chunk_071')
          review.mkdir(parents=True, exist_ok=True)
          api='https://commons.wikimedia.org/w/api.php'
          ua={'User-Agent':'Huizinga-strict-reproofread-v2/1.0 (research verification)'}
          exact_title='File:HUI 75 I 1.1.pdf'

          def get_json(params):
              url=api+'?'+urllib.parse.urlencode(params)
              for attempt in range(5):
                  try:
                      req=urllib.request.Request(url,headers=ua)
                      with urllib.request.urlopen(req,timeout=60) as r:
                          return json.load(r)
                  except urllib.error.HTTPError as e:
                      if e.code != 429 or attempt == 4:
                          raise
                      time.sleep(2 ** attempt)

          # One exact metadata request. No category rescan.
          meta=get_json({
              'action':'query','format':'json','prop':'imageinfo','titles':exact_title,
              'iiprop':'url|size|mime'
          })
          pg=next(iter(meta.get('query',{}).get('pages',{}).values()))
          ii=(pg.get('imageinfo') or [{}])[0]
          pagecount=int(ii.get('pagecount') or 0)
          pdf_url=ii.get('url','')

          # Probe only the first four pages. These are enough to prove source/page alignment.
          rows=[]
          for source_page in range(1,min(pagecount,4)+1):
              obj=get_json({
                  'action':'query','format':'json','prop':'imageinfo','titles':exact_title,
                  'iiprop':'url|size|mime','iiurlwidth':'1200',
                  'iiurlparam':f'page{source_page}-1200px'
              })
              p=next(iter(obj.get('query',{}).get('pages',{}).values()))
              info=(p.get('imageinfo') or [{}])[0]
              rows.append((source_page,info.get('thumburl',''),info.get('thumbwidth',''),info.get('thumbheight',''),info.get('url','')))
              time.sleep(1)

          with (review/'source_probe_hui75_i1_1.tsv').open('w',encoding='utf-8',newline='') as f:
              w=csv.writer(f,delimiter='\t')
              w.writerow(['source_page','commons_thumb_1200','thumb_width','thumb_height','commons_pdf_url'])
              w.writerows(rows)

          note=(
              '# chunk_071 strict-v2 source resolution\n\n'
              f'- Exact first item resolved: `{exact_title}`; source pages: **{pagecount}**.\n'
              f'- Commons PDF URL resolved by MediaWiki API: `{pdf_url}`.\n'
              '- `source_probe_hui75_i1_1.tsv` contains official Commons PDF-handler page thumbnails for source pages 1-4.\n'
              '- These URLs are only a visual comparison surface; no strict-v2 credit is awarded until each rendered scan page is actually compared to the corresponding repository OCR page.\n'
              '- Existing `source_candidates_hui75.tsv` remains the broader HUI 75 discovery table.\n'
              '- `_tmp_chunk071_pages/` remains the page-by-page repository OCR comparison surface.\n'
          )
          (review/'SOURCE_RESOLUTION_V2.md').write_text(note,encoding='utf-8')
          PY
      - name: Commit resolver outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add review/chunk_071/source_probe_hui75_i1_1.tsv review/chunk_071/SOURCE_RESOLUTION_V2.md
          git commit -m 'data: probe exact HUI 75 I 1.1 source pages' || exit 0
          git pull --rebase origin main
          git push origin main
