name: Patch Draft 04 twenty-second pass

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch_draft04_twentytwo_pass_2026_09_05.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard canonical draft against concurrent edits
        shell: bash
        run: |
          current=$(git hash-object writing/benevolent_outsider_draft_04_method_primitive_1921_1933.md)
          test "$current" = "75ccb870c6c9eeda90d279f895df2d8abc8a175b"
      - name: Apply twenty-second-pass patch
        run: python scripts/patch_draft04_twentytwo_pass_2026_09_05.py
      - name: Commit without overwriting concurrent work
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add writing/benevolent_outsider_draft_04_method_primitive_1921_1933.md
          git commit -m 'Reorder pre-contact controls chronologically'
          git pull --rebase origin main
          git push origin main
