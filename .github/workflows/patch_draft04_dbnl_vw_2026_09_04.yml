name: Patch Draft 04 from DBNL collected works

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch_draft04_dbnl_vw_2026_09_04.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard canonical draft blob
        run: |
          actual=$(git rev-parse HEAD:writing/benevolent_outsider_draft_04_method_primitive_1921_1933.md)
          expected=176cc10280b0b906a2d2062fafd0bc460dd04876
          echo "draft blob: $actual"
          test "$actual" = "$expected"
      - name: Apply local source-locked patch
        run: python scripts/patch_draft04_dbnl_vw_2026_09_04.py
      - name: Commit without overwriting concurrent work
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add writing/benevolent_outsider_draft_04_method_primitive_1921_1933.md
          git commit -m 'Integrate DBNL collected-works evidence into Draft 04'
          git pull --rebase origin main
          git push origin main
