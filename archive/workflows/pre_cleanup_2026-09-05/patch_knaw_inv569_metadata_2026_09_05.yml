name: Patch KNAW inv 569 locator control

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch_knaw_inv569_metadata_2026_09_05.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard KNAW control note against concurrent edits
        shell: bash
        run: |
          test "$(git hash-object research/article_knaw_malinowski_1933_membership_mechanics_recheck_2026-09-05.md)" = "d1a0751351ceccdf810aaf868f297d146901ee43"
      - name: Correct OpenData date and add inv 569 locator
        shell: python
        run: |
          from pathlib import Path
          p = Path('research/article_knaw_malinowski_1933_membership_mechanics_recheck_2026-09-05.md')
          s = p.read_text(encoding='utf-8')
          old_meta = "The dataset is marked **openbaar**, released under **CC0**, and was last modified **6 July 2026**."
          new_meta = "The dataset is marked **openbaar** and released under **CC0**. A direct check of the permanent OpenData page on 5 September 2026 displays `Laatst gewijzigd` as **14 July 2024**; this corrects an earlier search-result parse that had supplied 6 July 2026."
          assert s.count(old_meta) == 1, s.count(old_meta)
          s = s.replace(old_meta, new_meta, 1)

          anchor = "A separate 2025 scholarly provenance citation to `NL-HlmNHA, KNAW te Amsterdam, 64, inv.no. 390` for a 22 February 1933 Natural Sciences letter confirms that 1933 material is represented at item level in toegang 64, but **inv.no. 390 does not localize Malinowski's Letterkunde candidature and must not be reused as a membership locator**.\n\n"
          addition = """### First item-level membership locator recovered: inv. 569\n\nA published archival citation supplies the first directly relevant membership-file locator inside toegang 64: **inv. nr. 569, `Benoemingen van leden van de afdeling letterkunde 1855–1940`**. The citation appears in archival scholarship that also identifies **inv. nr. 19** as `Notulenboek van de afdeling letterkunde (II), maart 1863 – december 1878`.\n\nControl source: *Studien zur Geschichte und Kultur Nordwesteuropas* (Waxmann preview), p. 76, notes 124–125: https://api.pageplace.de/preview/DT0400.9783830980957_A25037839/preview-9783830980957_A25037839.pdf\n\nStatus of inv. 569: **PRIORITY LOCATOR / PARTIAL**. Its title and 1855–1940 date span make it a direct place to inspect for the 1933 candidature, but the cited description says only `leden`. The dossier itself has not yet been inspected, so do **not** infer that it includes foreign members, Malinowski, the nomination paper, or the vote. The immediate archive query is now: inspect inv. 569 for `Malinowski`, 1933, `buitenlandsch/uitlandsch lid`, candidature, signatories, recommendation, and appointment. If foreign members are excluded, use its series context to identify the corresponding foreign-member file.\n\nInv. 19 is useful only as evidence that Letterkunde minutes are a numbered volume series. It does not justify guessing the inventory number of the volume covering 1933.\n\n"""
          assert s.count(anchor) == 1, s.count(anchor)
          s = s.replace(anchor, anchor + addition, 1)

          old_secure = "- toegang 64 has a current public CC0 EAD inventory with 852 placement-list numbers;\n- Huizinga had been president of the KNAW Afdeeling Letterkunde since 11 November 1929, so his May 1933 refusal of a leading role occurred from institutional office rather than institutional distance."
          new_secure = "- toegang 64 has a current public CC0 EAD inventory with 852 placement-list numbers;\n- a directly relevant membership-file locator is now known: toegang 64, inv. 569, `Benoemingen van leden van de afdeling letterkunde 1855–1940`; its coverage of foreign members/Malinowski remains to be verified from the dossier;\n- Huizinga had been president of the KNAW Afdeeling Letterkunde since 11 November 1929, so his May 1933 refusal of a leading role occurred from institutional office rather than institutional distance."
          assert s.count(old_secure) == 1, s.count(old_secure)
          s = s.replace(old_secure, new_secure, 1)

          old_open = "- exact inventory number(s) for the 1933 membership/minutes material within toegang 64.\n\nThe next primary control is now **item-level retrieval within Noord-Hollands Archief, toegang 64**, rather than a generic archive-level search. A directly accessible contemporaneous Academy proceedings/minutes volume could independently close the same gap."
          new_open = "- whether inv. 569 contains Malinowski's foreign-member candidature/appointment material or only another class of `leden`;\n- exact inventory number for the Letterkunde minutes covering May–June 1933 and any separate nomination/`voordracht` file.\n\nThe next primary control is now **inspection of Noord-Hollands Archief, toegang 64, inv. 569**, followed by identification of the 1933 Letterkunde minutes volume if inv. 569 does not itself settle the mechanics. A directly accessible contemporaneous Academy proceedings/minutes volume could independently close the same gap."
          assert s.count(old_open) == 1, s.count(old_open)
          s = s.replace(old_open, new_open, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit without overwriting concurrent work
        shell: bash
        run: |
          git config user.name 'Haohao Zhang'
          git config user.email 'zhhos98@gmail.com'
          git add research/article_knaw_malinowski_1933_membership_mechanics_recheck_2026-09-05.md
          git commit -m 'Add KNAW inv 569 membership locator and correct metadata'
          git pull --rebase origin main
          git push origin HEAD:main
