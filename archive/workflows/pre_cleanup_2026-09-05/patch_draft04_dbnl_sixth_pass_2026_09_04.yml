name: Patch Draft 04 from DBNL sixth pass

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch_draft04_dbnl_sixth_pass_2026_09_04.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard canonical draft blob
        run: |
          test "$(git hash-object writing/benevolent_outsider_draft_04_method_primitive_1921_1933.md)" = "5d3549149a1cf9814f97e73f336c9c03d10c456b"
      - name: Apply source-locked local patch
        run: python scripts/patch_draft04_dbnl_sixth_pass_2026_09_04.py
      - name: Commit without overwriting concurrent work
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add writing/benevolent_outsider_draft_04_method_primitive_1921_1933.md
          git commit -m 'Calibrate Hofstra relation-first use in Draft 04'
          git pull --rebase origin main
          git push origin main
