name: Patch AGENTS KNAW legacy index route

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch_agents_knaw_inv569_presidency_2026_09_05.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard AGENTS against concurrent edits
        shell: bash
        run: |
          test "$(git hash-object AGENTS.md)" = "ff33720210fdfeae9964d1f42df6fd28eae6151b"
      - name: Add legacy index route to KNAW QA state
        shell: python
        run: |
          from pathlib import Path
          p = Path('AGENTS.md')
          s = p.read_text(encoding='utf-8')
          old = "The archive route is now specific: **Noord-Hollands Archief, toegang 64**, and the first directly relevant item-level locator recovered is **inv. 569, `Benoemingen van leden van de afdeling letterkunde 1855–1940`**. Treat inv. 569 as **PRIORITY / PARTIAL** until the dossier is inspected: its title does not yet prove coverage of foreign members or Malinowski. The exact Letterkunde minutes volume for May–June 1933 and any separate nomination/`voordracht` file remain unresolved. Do not reopen broad `Malinowski + KNAW` web searches; continue from inv. 569, the 1933 Letterkunde minutes series, or a directly exposed candidature/election record."
          new = "The archive route is now specific: **Noord-Hollands Archief, toegang 64**, and the first directly relevant item-level locator recovered is **inv. 569, `Benoemingen van leden van de afdeling letterkunde 1855–1940`**. Treat inv. 569 as **PRIORITY / PARTIAL** until the dossier is inspected: its title does not yet prove coverage of foreign members or Malinowski. A second route is now more precise than guessing the 1933 minutes volume: the later KNAW archive preserves legacy indexes reaching back to 1925. **Inv. 1464 (J–O)** indexes the minute books and can supply a Roman volume number plus page; **inv. 1470 (M–R)** indexes old archive dossiers. Their `Malinowski` contents remain uninspected. The exact Letterkunde minutes volume/page for May–June 1933 and any separate nomination/`voordracht` file remain unresolved. Do not reopen broad `Malinowski + KNAW` web searches; pull inv. 569, then inspect legacy index boxes 1464 and 1470 for the direct minute-book/dossier pointer."
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit without overwriting concurrent work
        shell: bash
        run: |
          git config user.name 'Haohao Zhang'
          git config user.email 'zhhos98@gmail.com'
          git add AGENTS.md
          git commit -m 'Route KNAW QA through legacy minute and dossier indexes'
          git pull --rebase origin main
          git push origin HEAD:main
