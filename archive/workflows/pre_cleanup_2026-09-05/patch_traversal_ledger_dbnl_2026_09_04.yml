name: Sync traversal ledger with DBNL collected works

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch_traversal_ledger_dbnl_2026_09_04.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch only DBNL ledger anchors
        run: python scripts/patch_traversal_ledger_dbnl_2026_09_04.py
      - name: Commit without overwriting concurrent traversal work
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/article_full_corpus_traversal_2026-09-04.md
          git commit -m 'Record DBNL collected-works traversal in article ledger'
          git pull --rebase origin main
          git push origin main
